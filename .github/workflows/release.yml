name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build distributable ZIP
        run: |
          mkdir -p dist/detective-board
          cp -r module.json src styles languages README.md LICENSE dist/detective-board/
          cd dist
          zip -qr detective-board.zip detective-board
          cp detective-board/module.json module.json
      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/detective-board.zip
            dist/module.json
